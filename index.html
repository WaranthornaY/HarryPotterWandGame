<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hogwarts Web Wand Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { margin: 0; background: #0b0b14; color: white; font-family: sans-serif; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; user-select: none; -webkit-user-select: none; }
        #ui-layer { position: absolute; z-index: 10; text-align: center; background: rgba(11, 11, 20, 0.95); padding: 30px; border-radius: 15px; border: 2px solid #8a2be2; width: 80%; max-width: 400px; }
        input, button { padding: 15px; font-size: 18px; margin: 10px 0; border-radius: 8px; border: none; text-align: center; width: 100%; box-sizing: border-box; }
        input { background: #222; color: white; border: 1px solid #8a2be2; }
        button { background: #8a2be2; color: white; cursor: pointer; font-weight: bold; }
        #permission-btn { background: #00ffcc; color: #000; display: none; }
        #wand-pad { width: 100vw; height: 100vh; display: none; background: #111; justify-content: center; align-items: center; flex-direction: column; touch-action: none; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h2 id="title">Detecting Magical Device...</h2>
        
        <div id="laptop-setup" style="display:none;">
            <p>On your PHONE, open this exact website link.</p>
            <h1 id="room-id" style="color: #00ffff; font-size: 42px;">Generating...</h1>
            <p>Waiting for your phone wand to connect...</p>
        </div>
        
        <div id="phone-setup" style="display:none;">
            <button id="permission-btn" onclick="requestDeviceSensors()">1. Enable Phone Sensors ⚡</button>
            <input type="text" id="join-id" placeholder="Enter Laptop ID">
            <button id="connect-btn" onclick="connectToLaptop()">2. Link Wand ✨</button>
        </div>
    </div>

    <div id="wand-pad">
        <h2 id="wand-status" style="color: #666;">Wand Disconnected</h2>
        <p style="color: #aaa; text-align: center; padding: 0 20px; font-size: 18px;">PRESS & HOLD your thumb down, slash your phone UP/DOWN/LEFT/RIGHT, then release to cast!</p>
    </div>

    <script>
        let isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
        let peer, conn;
        
        // Tracking Matrix
        let spellTrail = [];
        let handX = 0, handY = 0;         
        let isPhoneDrawing = false;
        let currentBackgroundColor = [11, 11, 20];

        // Remember previous orientation values to calculate speed (Delta)
        let lastPitch = null;
        let lastRoll = null;

        window.onload = function() {
            peer = new Peer();

            if (isMobile) {
                document.getElementById('title').innerText = "🧙‍♂️ Wand Controller";
                document.getElementById('phone-setup').style.display = "block";
                
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    document.getElementById('permission-btn').style.display = "block";
                }
            } else {
                document.getElementById('title').innerText = "🏰 Hogwarts Monitor";
                document.getElementById('laptop-setup').style.display = "block";
                
                peer.on('open', (id) => { document.getElementById('room-id').innerText = id; });
                peer.on('connection', (incomingConn) => {
                    conn = incomingConn;
                    document.getElementById('ui-layer').style.display = "none";
                    setupDataListeners();
                });
            }
        };

        function requestDeviceSensors() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(state => {
                        if (state === 'granted') {
                            document.getElementById('permission-btn').style.background = "#555";
                            document.getElementById('permission-btn').innerText = "Sensors Unlocked ✅";
                        }
                    })
                    .catch(console.error);
            }
        }

        function connectToLaptop() {
            let targetID = document.getElementById('join-id').value.trim();
            conn = peer.connect(targetID);
            
            conn.on('open', () => {
                document.getElementById('ui-layer').style.display = "none";
                document.getElementById('wand-pad').style.display = "flex";
                document.getElementById('wand-status').innerText = "Wand Linked ✨";
                document.getElementById('wand-status').style.color = "#00ffff";
                setupPhoneSensors();
            });
        }

        function setupPhoneSensors() {
            let wandPad = document.getElementById('wand-pad');
            
            wandPad.addEventListener('touchstart', (e) => { 
                e.preventDefault();
                conn.send({ type: "draw_state", drawing: true }); 
                wandPad.style.background = "#220033"; 
            });
            wandPad.addEventListener('touchend', (e) => { 
                e.preventDefault();
                conn.send({ type: "draw_state", drawing: false }); 
                wandPad.style.background = "#111";
            });

            // Fallback to Bulletproof DeviceOrientation (Guaranteed to stream on all devices)
            window.addEventListener('deviceorientation', (event) => {
                if (conn && conn.open) {
                    let currentPitch = event.beta;  // -180 to 180
                    let currentRoll = event.gamma;   // -90 to 90

                    if (lastPitch === null) lastPitch = currentPitch;
                    if (lastRoll === null) lastRoll = currentRoll;

                    // Delta tracking: How fast did the angle shift between frames?
                    let deltaRoll = currentRoll - lastRoll;
                    let deltaPitch = currentPitch - lastPitch;

                    // Handle edge cases where compass loops over
                    if (Math.abs(deltaRoll) > 50) deltaRoll = 0;
                    if (Math.abs(deltaPitch) > 50) deltaPitch = 0;

                    conn.send({
                        type: "angle_delta",
                        dRoll: deltaRoll,
                        dPitch: deltaPitch
                    });

                    lastPitch = currentPitch;
                    lastRoll = currentRoll;
                }
            });

            conn.on('data', (data) => {
                if (data.type === "spell_success") {
                    wandPad.style.backgroundColor = data.color;
                    document.getElementById('wand-status').innerText = data.spellName.toUpperCase() + "!";
                    setTimeout(() => {
                        wandPad.style.backgroundColor = "#111";
                        document.getElementById('wand-status').innerText = "Wand Linked ✨";
                    }, 2000);
                }
            });
        }

        function setupDataListeners() {
            handX = width / 2;
            handY = height / 2;

            conn.on('data', (data) => {
                if (data.type === "draw_state") {
                    isPhoneDrawing = data.drawing;
                    if (!isPhoneDrawing) {
                        evaluateSpell(); 
                    }
                }
                
                if (data.type === "angle_delta") {
                    // Turn swift twists and slashes into continuous screen movement
                    // Multiplying by 4 makes it highly sensitive to quick wrist slashes!
                    handX += data.dRoll * 4.5;
                    handY += data.dPitch * 4.5;

                    // Keep the pointer pinned within your game frame
                    handX = constrain(handX, 0, width);
                    handY = constrain(handY, 0, height);

                    if (isPhoneDrawing) {
                        spellTrail.push({ x: handX, y: handY });
                    }
                }
            });
        }

        function setup() {
            if (!isMobile) createCanvas(windowWidth, windowHeight);
            else noCanvas();
        }

        function draw() {
            if (isMobile) return;
            background(currentBackgroundColor[0], currentBackgroundColor[1], currentBackgroundColor[2]);

            // Draw Magic Spell Path
            noFill();
            strokeWeight(12);
            for (let i = 1; i < spellTrail.length; i++) {
                let alpha = map(i, 0, spellTrail.length, 0, 255);
                stroke(255, 215, 0, alpha); // Fading golden spark trail
                line(spellTrail[i-1].x, spellTrail[i-1].y, spellTrail[i].x, spellTrail[i].y);
            }

            // Draw Wand Tip Focus Cursor
            fill(255, 255, 200);
            noStroke();
            circle(handX, handY, 30);
        }

        function evaluateSpell() {
            if (spellTrail.length < 5) {
                spellTrail = [];
                return;
            }

            let startPoint = spellTrail[0];
            let endPoint = spellTrail[spellTrail.length - 1];
            
            let totalX = endPoint.x - startPoint.x;
            let totalY = endPoint.y - startPoint.y;

            // Simple Directional Swipe Classifier
            if (totalY > 100 && Math.abs(totalX) < 100) {
                triggerSpellResult("Avada Kedavra", [0, 150, 50]); // Downward Slash = Green
            } else if (totalY < -100 && Math.abs(totalX) < 100) {
                triggerSpellResult("Ascendio", [100, 150, 255]);   // Upward Slash = Blue
            } else if (totalX > 100 && Math.abs(totalY) < 100) {
                triggerSpellResult("Incendio", [255, 69, 0]);      // Right Slash = Fire Red
            } else {
                triggerSpellResult("Lumos", [255, 255, 255]);      // Default circle/shake = White
            }

            spellTrail = []; 
        }

        function triggerSpellResult(name, rgbColor) {
            currentBackgroundColor = rgbColor;
            conn.send({ 
                type: "spell_success", 
                spellName: name, 
                color: "rgb(" + rgbColor.join(",") + ")" 
            });
            setTimeout(() => { currentBackgroundColor = [11, 11, 20]; }, 2000);
        }

        function windowResized() {
            if (!isMobile) resizeCanvas(windowWidth, windowHeight);
        }
    </script>
</body>
</html>
